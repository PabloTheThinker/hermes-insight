name: hermes-insight
version: "0.9.1"
description: >
  AI agent/model field pattern harness — agents, models, tools, skills, multi-agent
  compartments, fabric index, and Pattern Forge. Independent companion (not official Nous).
author: "Pablo Navarro"
kind: standalone
license: MIT
homepage: https://github.com/PabloTheThinker/hermes-insight
provides_hooks:
  - on_session_end
python_dependencies:
  - "hermes-insight>=0.9.0,<0.10"
config_schema:
  agent_id:
    type: str
    description: Multi-agent compartment id (installer writes this when --agent is set)
  db_path:
    type: str
    description: SQLite lattice path (installer writes the profile-scoped default)
  agent_tier:
    type: str
    default: worker
    description: Agent seat tier (worker | conductor | client | …)
provides_tools:
  - insight_cycle
  - insight_ingest
  - insight_ingest_tree
  - insight_match
  - insight_distill
  - insight_feedback
  - insight_stats
  - insight_evolve
  - insight_index_server
  - insight_index_path
  - insight_index_connections
  - insight_fabric_stats
  - insight_forge
  - insight_perceive
  - insight_plan
  - insight_observe
  - insight_learn
  - insight_recall
  - insight_attune
  - insight_remember
  - insight_experience
  - insight_task
  - insight_connect
  - insight_bootstrap
  - insight_hygiene
  - insight_ingest_messages
