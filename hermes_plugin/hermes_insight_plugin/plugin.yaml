name: hermes-insight
version: "0.3.0"
description: >
  Superior pattern-processing harness — multi-lens recognition, distillation,
  trajectory, multi-agent compartments, code-aware ingest, and full server fabric
  indexing (projects, files, metadata, connections). Secrets scrubbed.
  Independent companion (not official Nous product).
author: "Pablo Navarro"
kind: standalone
provides_tools:
  - insight_cycle
  - insight_ingest
  - insight_ingest_tree
  - insight_match
  - insight_distill
  - insight_feedback
  - insight_stats
  - insight_evolve
  - insight_index_server
  - insight_index_path
  - insight_index_connections
  - insight_fabric_stats
